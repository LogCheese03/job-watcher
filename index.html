<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Watcher · Today</title>
  <meta name="theme-color" content="#0f4c5c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/common.js"></script>
</head>
<body>
<main class="wrap">
  <div id="offline" class="banner">You're offline — showing the data from the last time this page loaded.</div>
  <h1>Today</h1>
  <p class="sub" id="runtime">Loading…</p>

  <div class="cards">
    <div class="card"><div class="n" id="c-days">–</div><div class="l">Days with a successful run</div></div>
    <div class="card"><div class="n" id="c-open">–</div><div class="l">Open postings</div></div>
    <div class="card"><div class="n" id="c-new">–</div><div class="l">New today</div></div>
    <div class="card"><div class="n" id="c-removed">–</div><div class="l">Removed today</div></div>
  </div>

  <div class="grid2">
    <section class="panel">
      <h2>New postings in the latest run</h2>
      <ul class="plist" id="new-list"></ul>
    </section>
    <section class="panel">
      <h2>Removed postings in the latest run</h2>
      <ul class="plist" id="removed-list"></ul>
    </section>
  </div>

  <section class="panel">
    <h2>Sources</h2>
    <p class="sub" id="src-summary"></p>
    <table>
      <thead><tr><th>Source</th><th>Employer</th><th>Status</th><th class="num">Postings</th></tr></thead>
      <tbody id="sources"></tbody>
    </table>
  </section>
</main>

<script>
function listHTML(rows, emptyText) {
  if (!rows.length) return `<li class="empty">${emptyText}</li>`;
  rows.sort((a, b) => (b.in_role - a.in_role) || a.employer.localeCompare(b.employer) || a.title.localeCompare(b.title));
  return rows.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>
    ${r.in_role ? '<span class="pill">in role</span>' : ""}
    <div class="meta">${esc(r.employer)}${r.location ? " · " + esc(r.location) : ""}</div></li>`).join("");
}

loadData().then(({ status, history, runDay }) => {
  document.getElementById("runtime").textContent =
    `Last run: ${fmtTime(status.run_time)} · run date ${runDay} UTC · watching since ${status.first_run_date}`;
  document.getElementById("c-days").textContent = fmtNum(status.days_with_success);
  document.getElementById("c-open").textContent = fmtNum(status.open);
  document.getElementById("c-new").textContent = fmtNum(status.new_today);
  document.getElementById("c-removed").textContent = fmtNum(status.removed_today);

  const newRows = history.filter(r => r.first_seen === runDay && !r.first_run);
  const removedRows = history.filter(r => r.removed_date === runDay);
  document.getElementById("new-list").innerHTML = listHTML(newRows, "No new postings in the latest run.");
  document.getElementById("removed-list").innerHTML = listHTML(removedRows, "No removed postings in the latest run.");

  const employers = {};
  history.forEach(r => { employers[r.source] = r.employer; });
  const ok = status.sources.filter(s => s.ok).length;
  document.getElementById("src-summary").textContent = `${ok} of ${status.sources.length} sources answered in the latest run.`;
  document.getElementById("sources").innerHTML = status.sources.map(s => `<tr>
    <td>${esc(s.name)}</td><td>${esc(employers[s.name] || "")}</td>
    <td class="${s.ok ? "ok" : "fail"}">${s.ok ? "OK" : "Failed"}</td>
    <td class="num">${s.ok ? fmtNum(s.count) : "–"}</td></tr>`).join("");
}).catch(showError);
</script>
</body>
</html>
